name: Build PHP Images

on:
  workflow_dispatch:
    inputs:
      php:
        description: 'PHP version, for example 8.6'
        required: true
        default: '8.6'

jobs:
  build_php_images:
    runs-on: ubuntu-latest
    if: ${{ github.repository == 'openswoole/docker-openswoole' }}

    steps:
      -
        name: Checkout
        uses: actions/checkout@v4

      -
        name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      -
        name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      -
        name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      -
        name: Build and push Docker image openswoole/php:${{ inputs.php }}
        id: docker_build
        uses: docker/build-push-action@v5
        with:
          context: .
          file: dockerfiles/php/${{ inputs.php }}/Dockerfile
          platforms: linux/amd64,linux/arm64/v8
          push: true
          tags: openswoole/php:${{ inputs.php }}

      -
        name: Image digest of openswoole/php:${{ inputs.php }}
        run: echo ${{ steps.docker_build.outputs.digest }}
