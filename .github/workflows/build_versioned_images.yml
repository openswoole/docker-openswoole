name: Build Versioned Images

on:
  push:
    branches:
      - '[2-9]+.[0-9]+.[0-9]+'
      - '[2-9]+.[0-9]+.[0-9]+-?[a-zA-Z]**'

jobs:
  build_versioned_images:
    runs-on: ubuntu-22.04
    if: ${{ github.repository == 'openswoole/docker-openswoole' }}
    strategy:
      fail-fast: false
      matrix:
        php: ["8.2", "8.3", "8.4"]
        swoole47:
          - ${{ contains(github.ref, '4.7.') }}

    name: The image for PHP ${{ matrix.php }}

    steps:
      -
        name: Checkout
        uses: actions/checkout@v4

      -
        name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      -
        name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      -
        name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      -
        name: Set output parameters
        id: params
        run: |
          echo ::set-output name=branch_name::${GITHUB_REF##*/}
          branch_name=${GITHUB_REF##*/}
          major_version=${branch_name%.*}
          if egrep -q '^status\:\s*"under development"\s*($|\#)' "$(pwd)/config/${branch_name}.yml" ; then
            if [ ${{ matrix.php }} == '8.1' ] ; then
              echo "::set-output name=full_names::openswoole/openswoole:${branch_name}-php${{ matrix.php }},openswoole/openswoole:${major_version}-php${{ matrix.php }},openswoole/openswoole:${major_version},openswoole/openswoole:latest"
            else
              if [ ${{ matrix.php }} == '7.4' ] && [ ${major_version} == '4.4' ] ; then
                echo "::set-output name=full_names::openswoole/openswoole:${branch_name}-php${{ matrix.php }},openswoole/openswoole:${major_version}-php${{ matrix.php }},openswoole/openswoole:${major_version}"
              else
                echo "::set-output name=full_names::openswoole/openswoole:${branch_name}-php${{ matrix.php }},openswoole/openswoole:${major_version}-php${{ matrix.php }}"
              fi
            fi
          else
              echo "::set-output name=full_names::openswoole/openswoole:${branch_name}-php${{ matrix.php }}"
          fi

      -
        name: Build and push Docker image openswoole/openswoole:${{ steps.params.outputs.branch_name }}-php${{ matrix.php }}
        id: docker_build
        uses: docker/build-push-action@v5
        with:
          context: .
          file: dockerfiles/${{ steps.params.outputs.branch_name }}/php${{ matrix.php }}/cli/Dockerfile
          platforms: linux/amd64,linux/arm64/v8,linux/ppc64le,linux/s390x
          push: true
          tags: ${{ steps.params.outputs.full_names }}

      -
        name: Image digest of openswoole/openswoole:${{ steps.params.outputs.branch_name }}-php${{ matrix.php }}
        run: echo ${{ steps.docker_build.outputs.digest }}
