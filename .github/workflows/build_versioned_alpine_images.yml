name: Build Versioned Alpine Images

on:
  workflow_dispatch:
  push:
    branches:
      - '[2-9]+.[0-9]+.[0-9]+'
      - '[2-9]+.[0-9]+.[0-9]+-?[a-zA-Z]**'

jobs:
  build_versioned_alpine_images:
    runs-on: ubuntu-latest
    if: ${{ github.repository == 'openswoole/docker-openswoole' }}
    strategy:
      fail-fast: true
      matrix:
        php: ["8.3", "8.4", "8.5"]

    name: The Alpine image for PHP ${{ matrix.php }}

    steps:
      -
        name: Checkout
        uses: actions/checkout@v4

      -
        name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      -
        name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      -
        name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      -
        name: Set output parameters
        id: params
        run: |
          branch_name=${GITHUB_REF##*/}
          major_version=${branch_name%.*}
          echo "branch_name=${branch_name}" >> $GITHUB_OUTPUT
          if [ ${{ matrix.php }} == '8.3' ] ; then
            echo "full_names=openswoole/openswoole:${branch_name}-php${{ matrix.php }}-alpine,openswoole/openswoole:${major_version}-php${{ matrix.php }}-alpine,openswoole/openswoole:${major_version}-alpine,openswoole/openswoole:latest-alpine" >> $GITHUB_OUTPUT
          else
            echo "full_names=openswoole/openswoole:${branch_name}-php${{ matrix.php }}-alpine,openswoole/openswoole:${major_version}-php${{ matrix.php }}-alpine" >> $GITHUB_OUTPUT
          fi

      -
        name: Build and push Docker image openswoole/openswoole:${{ steps.params.outputs.branch_name }}-php${{ matrix.php }}-alpine
        id: docker_build
        uses: docker/build-push-action@v5
        with:
          context: .
          file: dockerfiles/${{ steps.params.outputs.branch_name }}/php${{ matrix.php }}/alpine/Dockerfile
          platforms: linux/amd64,linux/arm/v6,linux/arm/v7,linux/arm64/v8,linux/ppc64le
          push: true
          tags: ${{ steps.params.outputs.full_names }}

      -
        name: Image digest of openswoole/openswoole:${{ steps.params.outputs.branch_name }}-php${{ matrix.php }}-alpine
        run: echo ${{ steps.docker_build.outputs.digest }}
